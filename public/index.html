<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق دردشة الفيديو</title>
    <style>
        body { font-family: Tahoma, sans-serif; text-align: center; background: #222; color: #fff; margin-top: 50px; }
        video { width: 80%; max-width: 400px; border: 2px solid #fff; border-radius: 10px; background: #000; }
    </style>
</head>
<body>
    <h2>تجربة الكاميرا المباشرة</h2>
    <video id="myVideo" autoplay playsinline muted></video>

    <script>
        // تشغيل الكاميرا الأمامية فوراً للتجربة
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(stream => {
                const videoElement = document.getElementById('myVideo');
                videoElement.srcObject = stream;
            })
            .catch(error => {
                alert('فشل الوصول إلى الكاميرا: ' + error);
            });
    </script>
</body>
</html>
